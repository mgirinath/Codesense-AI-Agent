<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSense — AI Code Review Agent</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-theme="teal" data-mode="dark" class="intro-active">

  <!-- Intro animation -->
  <div id="intro">
    <div class="intro-logo">
      <span class="bracket">&lt;</span>
      <span class="intro-text">CodeSense</span>
      <span class="bracket">/&gt;</span>
    </div>
    <div class="intro-sub">AI Code Review Agent</div>
  </div>

  <div id="app">
    <div class="code-bg" id="code-bg" aria-hidden="true"></div>

    <!-- Sidebar: history, like Claude's chat list -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="logo-mini">&lt;CodeSense/&gt;</span>
        <button id="new-review-btn" title="New review">+</button>
      </div>
      <div class="sidebar-section-label">Recent Reviews</div>
      <ul id="history-list"></ul>
      <div id="history-empty" class="sidebar-empty"></div>
    </aside>

    <!-- Main -->
    <div id="main">
      <header id="topbar">
        <button id="sidebar-toggle" title="Toggle sidebar">☰</button>
        <h1>CodeSense<span class="header-cursor"></span></h1>
        <div class="topbar-actions">
          <button id="settings-btn" title="Settings">⚙</button>
          <div id="account-area"></div>
        </div>
      </header>

      <main>
        <section class="panel input-panel">
          <div class="editor-chrome">
            <span class="chrome-dot dot-red"></span>
            <span class="chrome-dot dot-yellow"></span>
            <span class="chrome-dot dot-green"></span>
            <span class="chrome-path">~/Get your Bytes-Back</span>
          </div>
          <div class="row">
            <label for="language">Language</label>
            <select id="language">
              <option value="python">Python</option>
              <option value="javascript">JavaScript</option>
              <option value="java">Java</option>
              <option value="c">C</option>
              <option value="cpp">C++</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="code-input-wrap">
            <textarea id="code" placeholder="Paste your code here..." spellcheck="false"></textarea>
            <div class="scan-line" aria-hidden="true"></div>
          </div>
          <button id="analyze-btn">Analyze Code</button>
          <p id="error-msg" class="error"></p>
        </section>

        <section class="results-panel" id="results" hidden>
          <div id="static-issues" class="panel static-issues"></div>
          <div id="review-output" class="panel review-output"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- Auth modal -->
  <div id="auth-modal" class="modal-overlay" hidden>
    <div class="modal">
      <button class="modal-close" data-close="auth-modal">&times;</button>
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="login">Log In</button>
        <button class="modal-tab" data-tab="signup">Sign Up</button>
      </div>

      <form id="login-form" class="modal-form">
        <input type="text" id="login-identifier" placeholder="Username or email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit">Log In</button>
        <p class="modal-error" id="login-error"></p>
      </form>

      <form id="signup-form" class="modal-form" hidden>
        <input type="text" id="signup-username" placeholder="Username" required>
        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="password" id="signup-password" placeholder="Password (min 6 characters)" required>
        <button type="submit">Create Account</button>
        <p class="modal-error" id="signup-error"></p>
      </form>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal-overlay" hidden>
    <div class="modal">
      <button class="modal-close" data-close="settings-modal">&times;</button>
      <h2>Settings</h2>

      <div class="settings-group">
        <div class="settings-label">Mode</div>
        <div class="theme-options" id="mode-options">
          <button data-mode="dark" class="theme-swatch active">Dark</button>
          <button data-mode="light" class="theme-swatch">Light</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-label">Accent Color</div>
        <div class="theme-options" id="accent-options">
          <button data-theme="teal" class="color-swatch active" style="--swatch:#5eead4"></button>
          <button data-theme="purple" class="color-swatch" style="--swatch:#c084fc"></button>
          <button data-theme="rose" class="color-swatch" style="--swatch:#fb7185"></button>
          <button data-theme="amber" class="color-swatch" style="--swatch:#f5a524"></button>
          <button data-theme="blue" class="color-swatch" style="--swatch:#60a5fa"></button>
        </div>
      </div>

      <div class="settings-group" id="account-settings">
        <div class="settings-label">Account</div>
        <p id="settings-account-info" class="settings-note"></p>
        <button id="settings-logout-btn" hidden>Log Out</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
